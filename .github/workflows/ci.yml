name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  db-security:
    name: Database security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start the local database
        timeout-minutes: 5
        run: npx supabase start -x studio,imgproxy,realtime,storage-api,logflare,vector,edge-runtime,mailpit,supavisor,postgres-meta,postgrest,kong
      - run: npm run test:db
        timeout-minutes: 5
      - name: Back up and restore the local database
        run: npm run test:backup
        timeout-minutes: 5

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Supabase starts while the browsers install. "Wait for local Supabase" below waits for
      # it and fails with its log if it didn't start.
      - name: Start local Supabase in the background (database, auth and API only)
        env:
          SKIP: studio,imgproxy,realtime,storage-api,logflare,vector,edge-runtime,mailpit,supavisor,postgres-meta
        run: |
          (
            npx supabase start -x "$SKIP" > "$RUNNER_TEMP/supabase.log" 2>&1
            echo $? > "$RUNNER_TEMP/supabase.code" && mv "$RUNNER_TEMP/supabase.code" "$RUNNER_TEMP/supabase.exit"
          ) > /dev/null 2>&1 &
      - name: Note the Playwright version and the runner image
        id: versions
        run: |
          echo "playwright=$(npx playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.versions.outputs.playwright }}
      # Ubuntu's download servers are sometimes very slow, so the browsers' system packages
      # come from GitHub's cache. It refills when the runner image or Playwright changes.
      - name: Cache the browsers' Ubuntu packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-deps
          key: playwright-deps-${{ steps.versions.outputs.image }}-${{ steps.versions.outputs.playwright }}
      - name: Install the browsers' Ubuntu packages
        timeout-minutes: 10
        run: bash scripts/browser-deps.sh ~/.cache/playwright-deps
      - name: Install the test browsers
        timeout-minutes: 5
        run: npx playwright install chromium webkit
      - name: Wait for local Supabase
        timeout-minutes: 5
        run: |
          until [ -f "$RUNNER_TEMP/supabase.exit" ]; do sleep 2; done
          cat "$RUNNER_TEMP/supabase.log"
          exit "$(cat "$RUNNER_TEMP/supabase.exit")"
      - run: npm run test:e2e
        timeout-minutes: 15
        env:
          CI: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=high
      - name: Check every package was published by its owner
        run: npm audit signatures
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$file" gitleaks
      - name: Scan the full history for leaked secrets
        run: ./gitleaks git --redact --verbose .
